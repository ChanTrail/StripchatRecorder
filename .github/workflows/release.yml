name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────
  # Build main binary + all modules (Linux only)
  # ─────────────────────────────────────────────
  build-server:
    name: Build server (linux-x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm i
        working-directory: frontend

      # ── Rust toolchain ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend -> ../build_tmp/backend/target
            modules/contact_sheet -> ../../build_tmp/modules/contact_sheet/target
            modules/filter_short -> ../../build_tmp/modules/filter_short/target
            modules/notify_discord -> ../../build_tmp/modules/notify_discord/target
            modules/notify_telegram -> ../../build_tmp/modules/notify_telegram/target
            modules/pp_utils -> ../../build_tmp/modules/pp_utils/target

      # ── System libraries ──
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev

      # ── Build everything via release script ──
      - name: Full release build
        run: node scripts/release.js

      # ── Assemble package directory ──
      #
      # Layout:
      #   stripchat-recorder-linux-x86_64/
      #   ├── stripchat-recorder
      #   └── modules/
      #       └── ...
      #
      - name: Assemble package
        run: |
          PKG="stripchat-recorder-linux-x86_64"
          mkdir -p "$PKG"
          cp -r build/. "$PKG/"
          echo "=== Package contents ==="
          find "$PKG" -type f | sort
          tar -czf "${PKG}.tar.gz" "$PKG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stripchat-recorder-linux-x86_64
          path: stripchat-recorder-linux-x86_64.tar.gz
          retention-days: 7

  # ─────────────────────────────────────────────
  # Build desktop app (multi-platform matrix)
  # ─────────────────────────────────────────────
  build-desktop:
    name: Build desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            artifact-name: StripchatRecorder-linux-x86_64
          - platform: windows-x86_64
            os: windows-latest
            artifact-name: StripchatRecorder-windows-x86_64
          - platform: macos-aarch64
            os: macos-latest
            artifact-name: StripchatRecorder-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm i
        working-directory: desktop

      # ── Rust toolchain ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies (desktop)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> ../../../build_tmp/desktop/target
            modules/contact_sheet -> ../../build_tmp/modules/contact_sheet/target
            modules/filter_short -> ../../build_tmp/modules/filter_short/target
            modules/notify_discord -> ../../build_tmp/modules/notify_discord/target
            modules/notify_telegram -> ../../build_tmp/modules/notify_telegram/target
            modules/pp_utils -> ../../build_tmp/modules/pp_utils/target
          key: desktop-${{ matrix.platform }}

      # ── Platform-specific system dependencies ──
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install macOS system dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install pkg-config

      # ── Build desktop via release script ──
      - name: Full desktop release build
        run: node scripts/release.desktop.js
        env:
          CARGO_TARGET_DIR: build_tmp/desktop/target

      # ── Upload bundle artifacts ──
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/desktop/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-server, build-desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List release assets
        run: ls -lhR artifacts/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: artifacts/**/*

name: Release

on:
  push:
    tags:
      - 'v*.*.*'       # 稳定版，例如 v0.4.0 / Stable releases, e.g. v0.4.0
      - 'v*.*.*-*'     # 预发布版，例如 v0.4.0-beta / Pre-releases, e.g. v0.4.0-beta

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 主程序构建（多平台）/ Server build (multi-platform) ──────────────────────
  build-server:
    name: Build server (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            artifact-name: StripchatRecorder-server-linux-x86_64
            archive-name: StripchatRecorder-server-linux-x86_64.zip

          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            artifact-name: StripchatRecorder-server-linux-aarch64
            archive-name: StripchatRecorder-server-linux-aarch64.zip

          - platform: windows-x86_64
            os: windows-latest
            artifact-name: StripchatRecorder-server-windows-x86_64
            archive-name: StripchatRecorder-server-windows-x86_64.zip

          - platform: darwin-aarch64
            os: macos-latest
            artifact-name: StripchatRecorder-server-darwin-aarch64
            archive-name: StripchatRecorder-server-darwin-aarch64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm i
        working-directory: frontend

      # ── Rust 工具链 / Rust toolchain ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend -> ../build_tmp/backend/target
            modules/cleanup -> ../../build_tmp/modules/cleanup/target
            modules/contact_sheet -> ../../build_tmp/modules/contact_sheet/target
            modules/filter_short -> ../../build_tmp/modules/filter_short/target
            modules/notify_discord -> ../../build_tmp/modules/notify_discord/target
            modules/notify_telegram -> ../../build_tmp/modules/notify_telegram/target
            modules/pp_utils -> ../../build_tmp/modules/pp_utils/target
            modules/ts_merge -> ../../build_tmp/modules/ts_merge/target
          key: server-${{ matrix.platform }}

      # ── 系统依赖（仅 Linux）/ System libraries (Linux only) ──
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev

      - name: Install macOS system dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install pkg-config

      # ── 构建 / Build ──
      - name: Full release build
        run: node scripts/release.js
        env:
          CARGO_BUILD_PLATFORM: ${{ matrix.platform }}

      # ── 打包（Linux / macOS）/ Assemble package (Linux / macOS) ──
      - name: Assemble package (Unix)
        if: runner.os != 'Windows'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG="${{ matrix.artifact-name }}-${VER}"
          ARCHIVE="${{ matrix.artifact-name }}-${VER}.zip"
          mkdir -p "$PKG"
          cp -r build/. "$PKG/"
          echo "=== Package contents ==="
          find "$PKG" -type f | sort
          zip -r "$ARCHIVE" "$PKG"
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      # ── 打包（Windows）/ Assemble package (Windows) ──
      - name: Assemble package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VER  = ($env:GITHUB_REF_NAME -replace '^v', '')
          $PKG  = "${{ matrix.artifact-name }}-${VER}"
          $ARCHIVE = "${{ matrix.artifact-name }}-${VER}.zip"
          New-Item -ItemType Directory -Force -Path $PKG | Out-Null
          Copy-Item -Recurse build\* $PKG\
          Write-Host "=== Package contents ==="
          Get-ChildItem -Recurse $PKG | Select-Object FullName
          Compress-Archive -Path $PKG -DestinationPath $ARCHIVE
          "archive=$ARCHIVE" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ env.archive }}
          retention-days: 7

  # ── 桌面端构建（多平台）/ Desktop build (multi-platform) ────────────────────
  build-desktop:
    name: Build desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            artifact-name: StripchatRecorder-desktop-linux-x86_64
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            artifact-name: StripchatRecorder-desktop-linux-aarch64
          - platform: windows-x86_64
            os: windows-latest
            artifact-name: StripchatRecorder-desktop-windows-x86_64
          - platform: macos-aarch64
            os: macos-latest
            artifact-name: StripchatRecorder-desktop-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm i
        working-directory: desktop

      # ── Rust 工具链 / Rust toolchain ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"

      - name: Cache Rust dependencies (desktop)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> ../../../build_tmp/desktop/target
            modules/cleanup -> ../../build_tmp/modules/cleanup/target
            modules/contact_sheet -> ../../build_tmp/modules/contact_sheet/target
            modules/filter_short -> ../../build_tmp/modules/filter_short/target
            modules/notify_discord -> ../../build_tmp/modules/notify_discord/target
            modules/notify_telegram -> ../../build_tmp/modules/notify_telegram/target
            modules/pp_utils -> ../../build_tmp/modules/pp_utils/target
            modules/ts_merge -> ../../build_tmp/modules/ts_merge/target
          key: desktop-${{ matrix.platform }}

      # ── 平台系统依赖 / Platform-specific system dependencies ──
      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install macOS system dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install pkg-config

      # ── 构建 / Build ──
      - name: Full desktop release build
        run: node scripts/release.desktop.js
        env:
          CARGO_TARGET_DIR: build_tmp/desktop/target
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── 打包模块 / Pack modules ──
      - name: Pack modules (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          zip -j build/desktop/modules-${{ matrix.platform }}.zip build/desktop/modules/*

      - name: Pack modules (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path build\desktop\modules\* `
            -DestinationPath build\desktop\modules-${{ matrix.platform }}.zip

      # ── 上传 Linux 产物 / Upload Linux artifacts ──
      - name: Upload Linux installers
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/desktop/appimage/*.AppImage
            build/desktop/appimage/*.AppImage.sig
            build/desktop/deb/*.deb
            build/desktop/rpm/*.rpm
            build/desktop/modules-${{ matrix.platform }}.zip
          retention-days: 7

      # ── 上传 macOS 产物 / Upload macOS artifacts ──
      - name: Upload macOS installers
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/desktop/dmg/*.dmg
            build/desktop/macos/*.app.tar.gz
            build/desktop/macos/*.app.tar.gz.sig
            build/desktop/modules-${{ matrix.platform }}.zip
          retention-days: 7

      # ── 上传 Windows 产物 / Upload Windows artifacts ──
      - name: Upload Windows installers
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/desktop/nsis/*.exe
            build/desktop/nsis/*.exe.sig
            build/desktop/modules-${{ matrix.platform }}.zip
          retention-days: 7

  # ── 创建 GitHub Release / Create GitHub Release ──────────────────────────────
  release:
    name: Create Release
    needs: [build-server, build-desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List release assets
        run: ls -lhR artifacts/

      # tag 始终来自 push 事件 / Tag always comes from the push event
      - name: Determine tag
        id: tag
        run: echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      # ── 生成 latest.json（tauri-plugin-updater 检查更新的 manifest）──────────
      # 遍历各平台的 .sig 签名文件，提取签名内容与对应安装包 URL，
      # 组装成 tauri-plugin-updater 所要求的 latest.json 格式。
      #
      # Build latest.json (the update manifest consumed by tauri-plugin-updater).
      # For each platform we locate the .sig file, read its signature, and pair it
      # with the GitHub release download URL of the corresponding installer.
      - name: Generate latest.json
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # ── Windows x86_64: prefer NSIS .exe over MSI ──
          WIN_SIG=""
          WIN_URL=""
          WIN_SIG_FILE=$(find artifacts -name "*_x64-setup.exe.sig" | head -1)
          WIN_EXE_FILE=$(find artifacts -name "*_x64-setup.exe" ! -name "*.sig" | head -1)
          if [ -n "$WIN_SIG_FILE" ] && [ -n "$WIN_EXE_FILE" ]; then
            WIN_SIG=$(cat "$WIN_SIG_FILE")
            WIN_URL="${BASE}/$(basename $WIN_EXE_FILE)"
          fi

          # ── Linux x86_64: AppImage ──
          LINUX_SIG=""
          LINUX_URL=""
          LINUX_SIG_FILE=$(find artifacts -name "*.AppImage.sig" | head -1)
          LINUX_APPIMAGE=$(find artifacts -name "*.AppImage" ! -name "*.sig" | head -1)
          if [ -n "$LINUX_SIG_FILE" ] && [ -n "$LINUX_APPIMAGE" ]; then
            LINUX_SIG=$(cat "$LINUX_SIG_FILE")
            LINUX_URL="${BASE}/$(basename $LINUX_APPIMAGE)"
          fi

          # ── macOS aarch64: .app.tar.gz (Tauri updater bundle) ──
          MAC_SIG=""
          MAC_URL=""
          MAC_SIG_FILE=$(find artifacts -name "*.app.tar.gz.sig" | head -1)
          MAC_TGZ=$(find artifacts -name "*.app.tar.gz" ! -name "*.sig" | head -1)
          if [ -n "$MAC_SIG_FILE" ] && [ -n "$MAC_TGZ" ]; then
            MAC_SIG=$(cat "$MAC_SIG_FILE")
            MAC_URL="${BASE}/$(basename $MAC_TGZ)"
          fi

          # ── 组装 JSON / Assemble JSON ──
          python3 - <<PYEOF
          import json, sys

          platforms = {}
          if "${WIN_SIG}" and "${WIN_URL}":
              platforms["windows-x86_64"] = {"signature": """${WIN_SIG}""", "url": "${WIN_URL}"}
          if "${LINUX_SIG}" and "${LINUX_URL}":
              platforms["linux-x86_64"] = {"signature": """${LINUX_SIG}""", "url": "${LINUX_URL}"}
          if "${MAC_SIG}" and "${MAC_URL}":
              platforms["darwin-aarch64"] = {"signature": """${MAC_SIG}""", "url": "${MAC_URL}"}

          manifest = {
              "version": "${VER}",
              "notes": "See https://github.com/${REPO}/releases/tag/${TAG} for release notes.",
              "pub_date": "${NOW}",
              "platforms": platforms
          }
          with open("artifacts/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("Generated latest.json:")
          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*
            artifacts/latest.json

  # ── Docker 镜像构建与推送 / Docker image build and push ──────────────────────
  # Docker 镜像在 CI 中从源码独立构建（复用 Dockerfile），不依赖 build-server 产物，
  # 因此可与 release job 完全并行。
  # The Docker image is built from source in CI (reusing the Dockerfile) and does not
  # depend on build-server artifacts, so it runs fully in parallel with the release job.
  # beta tag 时仅推送 "beta" 标签；稳定版同时推送 semver 版本号、major.minor 和 latest。
  # For beta tags only the "beta" tag is pushed; stable releases also get semver, major.minor, and latest.
  docker:
    name: Build and push Docker image
    needs: [build-server]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 稳定版：semver 版本号 + major.minor + latest
      # Stable: semver version + major.minor + latest
      - name: Extract Docker metadata (stable)
        id: meta-stable
        if: ${{ !contains(github.ref_name, '-') }}
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stripchat-recorder
            ghcr.io/${{ github.repository_owner }}/stripchat-recorder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # beta 版：仅推送固定的 "beta" 标签
      # Beta: push only the fixed "beta" tag
      - name: Extract Docker metadata (beta)
        id: meta-beta
        if: ${{ contains(github.ref_name, '-') }}
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stripchat-recorder
            ghcr.io/${{ github.repository_owner }}/stripchat-recorder
          tags: |
            type=raw,value=beta

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ contains(github.ref_name, '-') && steps.meta-beta.outputs.tags || steps.meta-stable.outputs.tags }}
          labels: ${{ contains(github.ref_name, '-') && steps.meta-beta.outputs.labels || steps.meta-stable.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

on:
  push:
    branches: [master, beta]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "docker-compose.yml"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 前端类型检查 / Frontend type-check ──────────────────────────────────────
  # 前端产物与平台无关，单平台检查足够；仅 vue-tsc 通过即可。
  # Frontend is platform-independent; only type-check (vue-tsc) is required.
  check-frontend:
    name: Check frontend (vue-tsc)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm i
        working-directory: frontend

      - name: Type-check
        run: npx vue-tsc --noEmit
        working-directory: frontend

  # ── 桌面端前端类型检查 / Desktop frontend type-check ────────────────────────
  # 同上，仅 vue-tsc 通过即可，不涉及 Rust。
  # Same reasoning — frontend only, no Rust needed.
  check-desktop-frontend:
    name: Check desktop frontend (vue-tsc)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm i
        working-directory: desktop

      - name: Type-check
        run: npx vue-tsc --noEmit
        working-directory: desktop

  # ── 桌面端后端检查 / Desktop backend check ──────────────────────────────────
  # 拆分自原 check-desktop-frontend，单独跑 Tauri (Rust) 部分。
  # Split from check-desktop-frontend; runs the Tauri (Rust) side only.
  check-desktop-backend:
    name: Check desktop backend (cargo)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: clippy

      - name: Cache Rust dependencies (desktop)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> ../../../build_tmp/desktop/target
          key: desktop-ci-linux

      - name: Check
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
        env:
          CARGO_TARGET_DIR: build_tmp/desktop/target

      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings
        env:
          CARGO_TARGET_DIR: build_tmp/desktop/target

  # ── 服务器端三平台检查 / Server cross-platform check ──────────────────────
  check-server:
    name: Check server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev

      - name: Install macOS system dependencies
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> ../build_tmp/backend/target
          key: server-ci-${{ matrix.os }}

      # RustEmbed 要求 dist 目录存在 / RustEmbed requires the dist directory to exist
      - name: Ensure build_tmp/frontend/dist exists
        shell: bash
        run: mkdir -p build_tmp/frontend/dist

      - name: Check
        run: cargo check --manifest-path backend/Cargo.toml
        env:
          CARGO_TARGET_DIR: build_tmp/backend/target

      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
        env:
          CARGO_TARGET_DIR: build_tmp/backend/target

  # ── 模块三平台检查 / Modules cross-platform check ───────────────────────────
  check-modules:
    name: Check modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential

      - name: Install macOS system dependencies
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            modules/cleanup -> ../../build_tmp/modules/cleanup/target
            modules/contact_sheet -> ../../build_tmp/modules/contact_sheet/target
            modules/filter_short -> ../../build_tmp/modules/filter_short/target
            modules/notify_discord -> ../../build_tmp/modules/notify_discord/target
            modules/notify_telegram -> ../../build_tmp/modules/notify_telegram/target
            modules/pp_utils -> ../../build_tmp/modules/pp_utils/target
            modules/ts_merge -> ../../build_tmp/modules/ts_merge/target
          key: modules-ci-${{ matrix.os }}

      - name: Check all modules
        shell: bash
        run: |
          for module_dir in modules/cleanup modules/contact_sheet modules/filter_short modules/notify_discord modules/notify_telegram modules/pp_utils modules/ts_merge; do
            if [ -f "$module_dir/Cargo.toml" ]; then
              echo "=== Checking $module_dir ==="
              cargo check --manifest-path "$module_dir/Cargo.toml"
              cargo clippy --manifest-path "$module_dir/Cargo.toml" -- -D warnings
            fi
          done

  # ── 自动打 Tag / Auto-tag (master only) ──────────────────────────────────────
  #
  # 所有平台的 check 全部通过后才运行，beta 分支不触发。
  # 从 package.json 读取版本号，若 tag 不存在则用 PAT 推送，触发 release.yml。
  #
  # Only runs after all platform checks pass; not triggered on beta.
  # Reads version from package.json; pushes a tag via PAT if it doesn't exist,
  # which triggers release.yml.
  auto-tag:
    name: Auto-tag release
    runs-on: ubuntu-22.04
    needs:
      [
        check-frontend,
        check-desktop-frontend,
        check-desktop-backend,
        check-server,
        check-modules,
      ]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  # ── 自动打 Tag / Auto-tag (beta only) ────────────────────────────────────────
  #
  # 逻辑与 auto-tag 相同，但仅在 beta 分支触发。
  # 版本号必须包含预发布后缀（如 -beta），否则跳过，避免意外覆盖稳定版 tag。
  #
  # Same logic as auto-tag, but triggered on the beta branch only.
  # Skips if the version has no pre-release suffix to avoid overwriting stable tags.
  auto-tag-beta:
    name: Auto-tag pre-release (beta)
    runs-on: ubuntu-22.04
    needs:
      [
        check-frontend,
        check-desktop-frontend,
        check-desktop-backend,
        check-server,
        check-modules,
      ]
    if: github.ref == 'refs/heads/beta' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT

      - name: Verify pre-release suffix
        id: pre_check
        run: |
          if echo "${{ steps.version.outputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+$'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Version '${{ steps.version.outputs.version }}' has no pre-release suffix, skipping tag."
          fi

      - name: Check if tag exists
        id: tag_check
        if: steps.pre_check.outputs.is_prerelease == 'true'
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.pre_check.outputs.is_prerelease == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

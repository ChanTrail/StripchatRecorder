name: CI

on:
  push:
    branches: [master, beta]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'docker-compose.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────
  # Frontend type-check & build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm i
        working-directory: frontend

      - name: Type-check & build
        run: npm run build
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Desktop type-check (vue-tsc + modules)
  # ─────────────────────────────────────────────
  check-desktop:
    name: Check desktop (type-check + modules)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm i
        working-directory: desktop

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies (desktop)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> ../../../build_tmp/desktop/target
          key: desktop-ci

      - name: Run desktop check
        run: node scripts/check.desktop.js
        env:
          CHECK_NESTED: "1"
          CARGO_TARGET_DIR: build_tmp/desktop/target

  # ─────────────────────────────────────────────
  # Main Rust binary: check + clippy
  # ─────────────────────────────────────────────
  check-main:
    name: Check main binary
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> ../build_tmp/backend/target
          key: main-ci

      - name: Ensure build_tmp/frontend/dist exists (required by RustEmbed)
        run: mkdir -p build_tmp/frontend/dist

      - name: Check
        run: cargo check --manifest-path backend/Cargo.toml
        env:
          CARGO_TARGET_DIR: build_tmp/backend/target

      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
        env:
          CARGO_TARGET_DIR: build_tmp/backend/target

  # ─────────────────────────────────────────────
  # Modules: check + clippy
  # ─────────────────────────────────────────────
  check-modules:
    name: Check modules
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            modules/contact_sheet -> ../../build_tmp/modules/contact_sheet/target
            modules/filter_short -> ../../build_tmp/modules/filter_short/target
            modules/notify_discord -> ../../build_tmp/modules/notify_discord/target
            modules/notify_telegram -> ../../build_tmp/modules/notify_telegram/target
            modules/pp_utils -> ../../build_tmp/modules/pp_utils/target
          key: modules-ci

      - name: Check all modules
        run: |
          for module_dir in modules/contact_sheet modules/filter_short modules/notify_discord modules/notify_telegram modules/pp_utils; do
            if [ -f "$module_dir/Cargo.toml" ]; then
              echo "=== Checking $module_dir ==="
              cargo check --manifest-path "$module_dir/Cargo.toml"
              cargo clippy --manifest-path "$module_dir/Cargo.toml" -- -D warnings
            fi
          done

  # ─────────────────────────────────────────────
  # Build desktop app (Linux only for speed)
  # ─────────────────────────────────────────────
  build-desktop:
    name: Build desktop (Linux)
    runs-on: ubuntu-22.04
    needs: [check-desktop, check-modules]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm i
        working-directory: desktop

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies (desktop)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> ../../../build_tmp/desktop/target
            modules/contact_sheet -> ../../build_tmp/modules/contact_sheet/target
            modules/filter_short -> ../../build_tmp/modules/filter_short/target
            modules/notify_discord -> ../../build_tmp/modules/notify_discord/target
            modules/notify_telegram -> ../../build_tmp/modules/notify_telegram/target
            modules/pp_utils -> ../../build_tmp/modules/pp_utils/target
          key: desktop-release

      - name: Full desktop release build
        run: node scripts/release.desktop.js
        env:
          CARGO_TARGET_DIR: build_tmp/desktop/target

  # ─────────────────────────────────────────────
  # Build main binary (Linux only for speed)
  # ─────────────────────────────────────────────
  build-main:
    name: Build main binary (Linux)
    runs-on: ubuntu-22.04
    needs: [frontend, check-main, check-modules]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> ../build_tmp/backend/target
          key: main-release

      - name: Full release build
        run: node scripts/release.js

name: CI

on:
  push:
    branches: [master, beta]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'docker-compose.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 前端类型检查与构建 / Frontend type-check & build ────────────────────────
  # 前端产物与平台无关，单平台检查足够。
  # Frontend output is platform-independent; single-platform check is sufficient.
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm i
        working-directory: frontend

      - name: Type-check & build
        run: npm run build
        working-directory: frontend

  # ── 桌面端前端类型检查 / Desktop frontend type-check ────────────────────────
  # 同上，前端与平台无关，单平台即可。
  # Same reasoning — frontend is platform-independent.
  check-desktop-frontend:
    name: Check desktop frontend (vue-tsc)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm i
        working-directory: desktop

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies (desktop)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> ../../../build_tmp/desktop/target
          key: desktop-ci-linux

      - name: Run desktop check
        run: node scripts/check.desktop.js
        env:
          CHECK_NESTED: "1"
          CARGO_TARGET_DIR: build_tmp/desktop/target

  # ── 服务器端三平台检查 / Server cross-platform check ──────────────────────
  check-server:
    name: Check server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev

      - name: Install macOS system dependencies
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> ../build_tmp/backend/target
          key: server-ci-${{ matrix.os }}

      # RustEmbed 要求 dist 目录存在 / RustEmbed requires the dist directory to exist
      - name: Ensure build_tmp/frontend/dist exists
        shell: bash
        run: mkdir -p build_tmp/frontend/dist

      - name: Check
        run: cargo check --manifest-path backend/Cargo.toml
        env:
          CARGO_TARGET_DIR: build_tmp/backend/target

      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
        env:
          CARGO_TARGET_DIR: build_tmp/backend/target

  # ── 模块三平台检查 / Modules cross-platform check ───────────────────────────
  check-modules:
    name: Check modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential

      - name: Install macOS system dependencies
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            modules/contact_sheet -> ../../build_tmp/modules/contact_sheet/target
            modules/filter_short -> ../../build_tmp/modules/filter_short/target
            modules/notify_discord -> ../../build_tmp/modules/notify_discord/target
            modules/notify_telegram -> ../../build_tmp/modules/notify_telegram/target
            modules/pp_utils -> ../../build_tmp/modules/pp_utils/target
          key: modules-ci-${{ matrix.os }}

      - name: Check all modules
        shell: bash
        run: |
          for module_dir in modules/contact_sheet modules/filter_short modules/notify_discord modules/notify_telegram modules/pp_utils; do
            if [ -f "$module_dir/Cargo.toml" ]; then
              echo "=== Checking $module_dir ==="
              cargo check --manifest-path "$module_dir/Cargo.toml"
              cargo clippy --manifest-path "$module_dir/Cargo.toml" -- -D warnings
            fi
          done

  # ── 自动打 Tag / Auto-tag (master only) ──────────────────────────────────────
  #
  # 所有平台的 check 全部通过后才运行，beta 分支不触发。
  # 从 package.json 读取版本号，若 tag 不存在则用 PAT 推送，触发 release.yml。
  #
  # Only runs after all platform checks pass; not triggered on beta.
  # Reads version from package.json; pushes a tag via PAT if it doesn't exist,
  # which triggers release.yml.
  auto-tag:
    name: Auto-tag release
    runs-on: ubuntu-22.04
    needs: [frontend, check-desktop-frontend, check-server, check-modules]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

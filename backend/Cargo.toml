[package]
name = "stripchat-recorder"
version = "0.4.11-beta"
description = "Stripchat Stream Recorder"
authors = ["ChanTrail"]
edition = "2024"

[lib]
name = "stripchat_recorder_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# ECH 探活用裸 TLS 握手（TLS1.3 + ECH），不经 HTTP——避免重定向把探活
# 拖进无关主机。与 hyper-rustls 保持同一 semver。/ The ECH liveness probe
# uses a bare TLS handshake (TLS1.3 + ECH) without HTTP, so redirects can't
# drag it onto unrelated hosts. Same semver as hyper-rustls.
tokio-rustls = "0.26"
reqwest = { version = "0.13", features = ["json", "socks", "rustls", "http2", "stream"], default-features = false }
# ECH（Encrypted Client Hello）：与 reqwest 内的 rustls 保持同一 semver 版本，
# `tls_backend_preconfigured` 按类型向下转型，版本不一致会导致 TLS 后端不识别。
# ECH (Encrypted Client Hello): keep the same semver as reqwest's bundled rustls —
# `tls_backend_preconfigured` downcasts by type and a version mismatch yields an
# "unknown" TLS backend.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pki-types = "1"
# ECH 客户端的证书校验走系统信任库（Windows 走 schannel）——TLS 拦截代理/
# 杀软装进系统库的 CA 也能验证；reqwest 普通客户端已自带此行为。/
# ECH clients verify against the OS trust store (schannel on Windows) so
# proxy/AV roots installed there also verify — reqwest's normal clients
# already do this via its bundled dependency.
rustls-platform-verifier = "0.7"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.11"
base64 = "0.23"
parking_lot = "0.12"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
tokio-stream = "0.1"
async-stream = "0.3"
rust-embed = { version = "8", features = ["axum"] }
mime_guess = "2"
rand = "0.10"
argon2 = { version = "0.6", features = ["rand_core"] }
notify = "8"
libc = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
self_update = { version = "1.3.1", default-features = false, features = ["archive-zip", "compression-zip-deflate", "rustls", "async"] }
duct = "1.1.2"
wait-timeout = "0.2.1"
tempfile = "3.27.0"
# FFmpeg 自动下载：解压 .tar.xz（Linux / macOS 构建产物）。static 特性从内置源码静态链接 liblzma，
# 不依赖系统库。/ FFmpeg auto-download: unpack .tar.xz archives (Linux / macOS builds). The `static`
# feature links liblzma statically from the bundled source, so no system library is needed.
tar = { version = "0.4", default-features = false }
liblzma = { version = "0.4", features = ["static"] }
sevenz-rust2 = { version = "0.25", default-features = false }

[dev-dependencies]
# 测试需要构造 7z 压缩包：compress 特性启用编码器。resolver v2 下 dev-deps 的
# feature 不会并入正常构建，发布产物仍只带解码器。
# Tests build 7z archives, which needs the encoder behind `compress`. Under
# resolver v2 a dev-dependency's features don't leak into normal builds, so
# shipped binaries still only carry the decoder.
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress"] }
